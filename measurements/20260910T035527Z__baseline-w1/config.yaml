# Baseline freshness measurement.
#
# Every field in this file is copied verbatim into the run directory, so the
# config IS the experiment description. Change nothing by hand at runtime.

experiment:
  name: baseline-w1
  description: >
    Client-observed freshness curve on a local 4-node MongoDB replica set,
    following the write-then-poll methodology of Wada et al., CIDR 2011.
  seed: 20260908          # seeds the per-sweep target shuffle; keep fixed per run

replica_set:
  name: rs0
  seed_hosts:
    - "localhost:27017"
    - "localhost:27018"
    - "localhost:27019"
    - "localhost:27020"

workload:
  database: freshness
  collection: probe
  doc_key: "probe-1"
  payload_bytes: 14        # CIDR wrote 14 bytes of string data
  cycles: 300              # write-then-poll cycles in this run
  warmup_cycles: 20        # discarded in analysis, still recorded on disk
  poll_window_ms: 30      # how long to keep reading after each write ack
  inter_sweep_us: 200      # idle gap between sweeps over all targets
  quiesce_ms: 500          # idle time after the poll window, before next write
  write_concern:
    w: 1          # "majority" | 1 | 2 | 3 | 4
    j: null                # null = server default, or true / false
    wtimeout_ms: 5000

# Each target is one distinct read path. "direct" addresses a single mongod and
# tells you where the bytes physically are; "replicaset" goes through the driver
# and tells you what an application actually observes.
targets:
  - id: direct-27017
    kind: direct
    host: "localhost:27017"
    read_preference: primaryPreferred
    read_concern: local

  - id: direct-27018
    kind: direct
    host: "localhost:27018"
    read_preference: secondaryPreferred
    read_concern: local

  - id: direct-27019
    kind: direct
    host: "localhost:27019"
    read_preference: secondaryPreferred
    read_concern: local

  - id: direct-27020
    kind: direct
    host: "localhost:27020"
    read_preference: secondaryPreferred
    read_concern: local

  - id: rs-primary-local
    kind: replicaset
    read_preference: primary
    read_concern: local

  - id: rs-secondary-local
    kind: replicaset
    read_preference: secondary
    read_concern: local

  - id: rs-secondary-majority
    kind: replicaset
    read_preference: secondary
    read_concern: majority

  - id: rs-secondary-causal
    kind: replicaset
    read_preference: secondary
    read_concern: local
    causal_consistency: true

capture:
  operation_time: true          # issue reads via db.command to capture operationTime
  repl_status_per_cycle: true   # replSetGetStatus at cycle start/end (outside poll window)
  repl_status_continuous: false # background sampling; adds GIL contention, off by default
  compress_output: true         # gzip the jsonl files at end of run

analysis:
  bucket_us: 200                # histogram bucket width for the freshness curve
  min_samples_per_bucket: 30
